version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demei-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - redis
      - db

  redis:
    image: redis:alpine
    container_name: demei-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: postgres:17-alpine
    container_name: demei-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  demei-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demei-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    depends_on:
      - app
      - redis
      - db

volumes:
  redis_data:
  db_data: